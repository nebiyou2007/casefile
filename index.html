<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,nitial-scale=1"><title>Casefile</title><style>body{margin:0;background:#f5f6f8;color:#11151b;font:15px system-ui}.header{position:sticky;top:0;background:#f5f6f8ee;border-bottom:1px solid #dde1e7}.bar{max-width:1100px;margin:auto;padding:14px 20px;display:flex;gap:12px;align-items:center}.brand{font:bold 25px Georgia}.search{flex:1;display:flex;gap:8px}.search input{flex:1;padding:11px;border:1px solid #ccd3dc;border-radius:9px}.btn{background:#1d3557;color:white;border:0;border-radius:9px;padding:11px 15px;cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:32px 20px}.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.hero h1{font:600 46px Georgia;margin:8px 0}.mut;{color:#5b6472}.panel,.card{background:#fff;border:1px solid #dde1e7;border-radius:14px}.panel{iadding:24px}.darkbackground:#11151b;color:#fff}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:25px 0}.filters button{border:1px solid #ccd3dc;background:white;border-radius:999px;padding:8px 12px}.filters .on{background:#1d3557;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:18px;cursor:pointer}.tag{font-size:11px;letter-spacing:.08em;color:#1d3557;font-weight:700}.title{font:600 24px Georgia;margin:8px 0}.meta{font-size:13px;color:#5b6472}.drawer{position:fixed;inset:0;background:#0007;display:none}.open{display:block}.sheet{position:absolute;right:0;top:0;height:100%;width:min(650px,100%);background:#fff;padding:28px;overflow:auto}.timeline{border-left:2px solid #1d3557;padding-left:18px}@media(max-width:750px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="bar"><div class="brand">CASEFILE</div><div class="search"><input id="q" placeholder="Search cases, people, places..."><button class="btn" onclick="render()">Search</button></div><button class="btn" onclick="document.body.classList.toggle('dark')">Theme</button></div></header><main class="wrap"><section class="hero"><div><div class="tag">CASEFILE 2.0</div><h1>A research workspace for real-world cases.</h1><p class="mut">This live build starts from your uploaded Casefile library and keeps the core archive experience fast and free.</p></div><div class="panel dark"><div class="tag" style="color:#b6c9df">RESEARCH MODE</div><h2>Open a case</h2><p>Inspect status, timeline, research notes and source starting points.</p><button class="btn" onclick="openCase(cases[0].id)">Open featured case -></button></div></section><div class="filters" id="filters"></div><h2>Case library</h2><p class="mut" id="count"></p><section class="grid" id="grid"></section></main><div class="drawer" id="drawer" onclick="if(event.target===this)closeCase()"><article class="sheet"><button class="btn" onclick="closeCase()">Close</button><div id="detail"></div></article></div><script>const cases=[{"id":"zodiac","title":"Zodiac Killer","cat":"Serial crime","country":"USA","year":1968,"status":"Unsolved","blurb":"Coded letters to newspapers and a string of Northern California attacks that were never solved."},{"id":"cooper","title":"D. B. Cooper hijacking","cat":"Heist","country":"USA","year":1971,"status":"Unsolved","blurb":"A hijacker took a ransom, parachuted from a Boeing 727 and was never identified."},{"id":"lindbergh","title":"Lindbergh kidnapping","cat":"Kidnapping","country":"USA","year":1932,"status":"Convicted","blurb":"The toddler son of a famed aviator was taken; the conviction of Bruno Hauptmann is still debated."},{"id":"madoff","title":"Bernie Madoff's Ponzi scheme","cat":"Fraud","country":"USA","year":2008,"status":"Convicted","blurb":"The largest investment fraud in history collapsed and ended in a 150year sentence."},{"id":"ripper","title":"Jack the Ripper","cat":"Serial crime","country":"UK","year":1888,"status":"Unsolved","blurb":"The Whitechapel murders of 1888 remain among the most studied unsolved cases."},{"id":"train","title":"Great Train Robbery","cat":"Heist","country":"UK","year":1963,"status":"Convicted","blurb":"A gang stopped a Royal Mail train and took about 2.6 million."},{"id":"enron","title":"Enron collapse","cat":"Fraud","country":"USA","year":2001,"status":"Convicted","blurb":"Hidden debts and false accounts brought down a giant energy company."},{"id":"lucan","title":"Lord Lucan disappearance","cat":"Murder","country":"UK","year":1974,"status":"Unsolved","blurb":"A nanny was killed in London and the earl named by the inquest vanished."}];let cat='All';let cats=['All'];cases.forEach(x=>{if(!cats.includes(x.cat))cats.push(x.cat)});cats.forEach(c=>{let b=document.createElement('button');b.textContent=c;b.dataset.c=c;b.onclick=()=>{cat=c;render()};document.getElementById('filters').appendChild(b)});function render(){let q=document.getElementById('q').value.toLowerCase().trim();document.querySelectorAll('#filters button').forEach(b=>b.classList.toggle('on',b.dataset.c===cat));let a=cases.filter(x=>(cat==='All'||x.cat===cat)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));document.getElementById('count').textContent=a.length+' cases';document.getElementById('grid').innerHTML=a.map(x=>'<article class="card" onclick="openCase(\''+x.id+'\')"><div class="tag">'+x.cat.toUpperCase()+'</div><div class="title">'+x.title+'</div><div class="meta">'+x.country+'  -  '+x.year+'  -  '+x.status+'</div><p>'+x.blurb+'</p></article>').join('')||'<p class="mut">No matching cases.</p>'}function openCase(id){let x=cases.find(y=>y.id===id);document.getElementById('detail').innerHTML='<div class="tag">'+x.cat.toUpperCase()+'</div><h1>'+x.title+'</h1><p class="mut">'+x.country+'  -  '+x.year+'  -  '+x.status+'</p><p>'+x.blurb+'</p><div class="panel"><h2>Research status</h2><p><b>Documented case:</b> start with primary records and reputable reporting.</p><p><b>Open questions:</b> separate established facts from disputed claims and unknowns.</p></div><h2>Timeline</h2><div class="timeline"><p><b>'+x.year+'</b><br>'+x.blurb+'</p><p><b>Research next</b><br>Find court records, archival material, official statements and contemporary reporting.</p></div><h2>Sources</h2><p><a target="_blank" href="https://www.google.com/search?q='+encodeURIComponent(x.title+' official records')+'">Official records</a> - <a target="_blank" href="https://www.google.com/search?q='+encodeURIComponent(x.title+' court records')+'">Court records</a> - <a target="_blank" href="https://www.google.com/search?q='+encodeURIComponent(x.title+' archive')+'">Archives</a></p>';document.getElementById('drawer').classList.add('open')}function closeCase(){document.getElementById('drawer').classList.remove('open')}render();</script></body></html>
